# Teste de voz (20 s): confere se a voz do Reel funciona no GitHub e manda o diagnóstico + o áudio no seu Telegram.
# Rodar: Actions > Teste de voz > Run workflow.
name: Teste de voz
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}

jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -q -r requirements.txt
      - name: Teste de voz
        run: python -m ghost.run voz
