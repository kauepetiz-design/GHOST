# Segunda 9h30: conferência da semana. Manda no seu Telegram a foto do anúncio ao lado da arte final
# dos próximos produtos (para você olhar em poucos minutos). Pode rodar na hora: Actions > Conferência semanal > Run workflow.
name: Conferência semanal
on:
  schedule:
    - cron: "30 12 * * 1"   # segunda 09:30 BRT
  workflow_dispatch:
    inputs:
      quantidade:
        description: "Quantos produtos conferir"
        default: "10"

permissions:
  contents: read

concurrency:
  group: ghost
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}

jobs:
  conferencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -q -r requirements.txt -r requirements-video.txt
      - name: Conferência da semana
        run: python -m ghost.run conferencia ${{ inputs.quantidade || '10' }}
